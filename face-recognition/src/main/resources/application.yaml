server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/face_recognition_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


# Thư mục lưu ảnh và model
face:
  data:
    path: ./faces_data/
  model:
    path: ./faces_data/trained_model.yml

# JWT
jwt:
  secret: 3052ff0255be70d1af2d8c77325df99cd2f2f8915d5c7c1e7b1307a3f1cc12a2
  expiration: 86400000   # 24 giờ

# Logging
logging:
  level:
    face_recognition: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE